# Strona gry na GitHub Pages: po każdej zmianie w main publikuje grę jako aplikację do zainstalowania
# na telefonie (PWA). Wymaga: Settings → Pages → Source: GitHub Actions.
name: Strona gry
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Lista plików i wersja dla service workera
        run: python3 tools/pwa_files.py
      - name: Pliki strony
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
